# WiiCompiled user configuration
# Set paths.dvd_root to an extracted Mario Kart Wii DATA directory.

[video]
widescreen = true
resolution_multiplier = 2
frame_interpolation_fps = 0
display_mode = "windowed"
graphics_api = "auto"
skip_unready_pipelines = true
disable_copy_filter = true
show_fps = true
# Dolphin-style custom textures. When enabled, the renderer indexes
# texture_replacements/ next to this file at startup and substitutes
# any tex1_<W>x<H>_<hash>[_<tlut hash>]_<format>.dds or .png it finds
# there for the matching game texture. texture_dumps writes every
# unmatched texture to Cache/texture_dumps under the name a
# replacement would need. Both are read once, at startup.
texture_replacements = false
texture_dumps = false
window_width = 3840
window_height = 2160
window_x = 0
window_y = 34

[audio]
volume = 1.0
music_volume = 1.0
sound_effects_volume = 1.0
ui_volume = 1.0
voices_volume = 1.0
muted = false
attenuate_music_when_media_plays = false
# Runs the AX/DSP voice mix on its own thread, joined before the
# guest can observe it. Set to false to mix inline on the guest
# thread exactly as the runtime did before.
mix_worker = true

[network]
enabled = true

[discord]
# Rich Presence talks only to a locally-running Discord client.
# Retro Rewind supplies its official app ID automatically. Set this
# to WiiCompiled's Discord application ID for basic base-game presence.
enabled = true
# client_id = "123456789012345678"

