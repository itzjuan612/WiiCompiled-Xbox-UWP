# WiiCompiled user configuration
# Set paths.dvd_root to an extracted Mario Kart Wii DATA directory.

[video]
widescreen = true
resolution_multiplier = 2
frame_interpolation_fps = 120
display_mode = "windowed"
graphics_api = "auto"
skip_unready_pipelines = true
# Threads compiling graphics pipelines at once. 0 (or leaving this out) uses
# the driver default: one on Xbox, where the memory shared with the GPU can be
# exhausted by concurrent compiles (crashing online play with a DXC
# out-of-memory), and one per available core elsewhere. Set it explicitly to
# retune; on a PC it is safe to raise, on Xbox only lower-than-1 is meaningful.
# pipeline_compile_workers = 0
# Free memory (MB) the renderer keeps in reserve before background shader
# precompilation pauses (0 or absent = 900 on Xbox). Lower it so more shaders
# finish precompiling before the first race; raise it for a larger safety
# margin. The rest always compile on demand the first time a scene needs them.
# prewarm_min_free_mb = 900
disable_copy_filter = true
show_fps = true
# Gamepad chord that opens the settings overlay: native button names
# (left_shoulder, north, dpad_up, start, back, guide, left_stick, ...)
# joined by '+'. Common aliases (LB, RB, A, B, X, Y, Start, Select, ...)
# work too. 'none' disables the chord so only F10 and the mouse open the
# menu. Read once, at startup.
# overlay_hotkey = "LB+RB+Y"
# Dolphin-style custom textures. When enabled, the renderer indexes
# texture_replacements/ next to this file at startup and substitutes
# any tex1_<W>x<H>_<hash>[_<tlut hash>]_<format>.dds or .png it finds
# there for the matching game texture. texture_dumps writes every
# unmatched texture to Cache/texture_dumps under the name a
# replacement would need. Both are read once, at startup.
texture_replacements = false
texture_dumps = false
window_width = 3840
window_height = 2160
window_x = 0
window_y = 34

[audio]
volume = 1.0
music_volume = 1.0
sound_effects_volume = 1.0
ui_volume = 1.0
voices_volume = 1.0
muted = false
attenuate_music_when_media_plays = false
# Runs the AX/DSP voice mix on its own thread, joined before the
# guest can observe it. Set to false to mix inline on the guest
# thread exactly as the runtime did before.
mix_worker = true

[network]
enabled = true

[discord]
# Rich Presence talks only to a locally-running Discord client.
# Retro Rewind supplies its official app ID automatically. Set this
# to WiiCompiled's Discord application ID for basic base-game presence.
enabled = true
# client_id = "123456789012345678"

